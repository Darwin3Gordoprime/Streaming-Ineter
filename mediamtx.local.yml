logLevel: info
rtmp: yes
rtmpAddress: 127.0.0.1:1935
rtsp: yes
rtspAddress: 127.0.0.1:8554
api: yes
apiAddress: 127.0.0.1:9997
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof
record: yes
recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
recordFormat: fmp4
recordPartDuration: 1s
recordSegmentDuration: 3h30m
recordDeleteAfter: 0s
paths:
  all_others:
    source: publisher
