services:
  mediamtx:
    ports: !override
      - "0.0.0.0:1935:1935"
    volumes:
      - ./deploy/azure/mediamtx.yml:/mediamtx.yml:ro

  app:
    environment:
      TRUST_PROXY: "1"
      PUBLIC_RTMP_URL: "rtmp://${STREAM_DOMAIN:?Set STREAM_DOMAIN in the project .env}:1935/live"
      OBS_INGEST_SERVER: "rtmp://${STREAM_DOMAIN:?Set STREAM_DOMAIN in the project .env}:1935/live"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the project .env}
      STREAM_DOMAIN: ${STREAM_DOMAIN:?Set STREAM_DOMAIN in the project .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/azure/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CERTBOT_WEBROOT:-/var/lib/ineter/acme-challenge}:/var/www/certbot:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
